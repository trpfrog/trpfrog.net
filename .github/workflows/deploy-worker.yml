name: Deploy Worker

on:
  workflow_call:
    inputs:
      app:
        description: Directory name under apps/
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.app }}
    # The deploy Environment also restricts deployments to main, because this
    # condition can be removed by editing the workflow.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: deploy
    concurrency:
      group: deploy-${{ inputs.app }}
      cancel-in-progress: false
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version: 24.x
          cache: true
          run-install: |
            - cwd: .
              args: ['--frozen-lockfile']

      - name: Generate types
        run: vp run -w typegen

      - name: Run checks
        run: vp check

      - name: Test
        run: vp test run

      # Loaded after the checks so that they run without credentials. Worker Secrets,
      # where an app has them, are resolved by its deploy:prod script.
      - name: Load Cloudflare credentials
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: true
          version: 2.41.1
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CLOUDFLARE_API_TOKEN: op://Production/trpfrog.net-deploy/CLOUDFLARE_API_TOKEN
          CLOUDFLARE_ACCOUNT_ID: op://Production/trpfrog.net-deploy/CLOUDFLARE_ACCOUNT_ID

      - uses: 1password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50 # v4.1.0
        with:
          version: 2.41.1

      - name: Deploy
        working-directory: apps/${{ inputs.app }}
        run: vp run deploy:prod
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
