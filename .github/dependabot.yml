version: 2

updates:
  # The root manifest covers every pnpm workspace package and the catalog.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: '12:00'
      timezone: Asia/Tokyo
    # pnpm rejects versions younger than minimumReleaseAge (1 day) in
    # pnpm-workspace.yaml, so wait longer than that before proposing them.
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: '12:00'
      timezone: Asia/Tokyo
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns:
          - '*'
